<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <!-- The admin login's side panel (settings.UNFOLD["LOGIN"]["image"]): the brand blue,
       a dot grid, and the roofline from the SWH logo drawn large and faint. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182234"/>
      <stop offset="0.55" stop-color="#2b405f"/>
      <stop offset="1" stop-color="#4a6fa6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#93b1d8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#93b1d8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#glow)"/>
  <rect width="900" height="1200" fill="url(#dots)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 700 L450 470 L760 680" stroke-width="30" stroke-opacity="0.1"/>
    <path d="M300 640 V900" stroke-width="30" stroke-opacity="0.1"/>
    <path d="M60 940 L450 640 L860 900" stroke-width="2" stroke-opacity="0.12"/>
    <circle cx="760" cy="240" r="150" stroke-width="2" stroke-opacity="0.08"/>
    <circle cx="760" cy="240" r="230" stroke-width="2" stroke-opacity="0.05"/>
  </g>
</svg>
